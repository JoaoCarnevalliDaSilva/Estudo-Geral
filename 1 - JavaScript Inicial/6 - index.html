<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./6 - style.css">
  <title>Dashboard Financeiro</title>
</head>
<body>

  <header>
    <h1>Dashboard Financeiro</h1>
  </header>

  <main>
    <div class="kpi">
      <div class="lado1">
        <h3>KPI 1: Total Entradas:</h3>
        <span id="total-entradas">R$ 0.00</span>
        <h3>KPI 3: Saldo Líquido:</h3>
        <span id="saldo-liquido">R$ 0.00</span>
      </div>
      <div class="lado2">
        <h3>KPI 2: Total Saídas:</h3>
        <span id="total-saidas">R$ 0.00</span>
        <h3>KPI 4: Total Pendente:</h3>
        <span id="total-pendente">R$ 0.00</span>
      </div>
    </div>
    
    <div class="resultados">
      <form onsubmit="calcular(event)">
        <label>Categoria:</label>
        <select id="categoria">
          <option value="Todos">Todos</option>
          <option value="Licença AWS">Licença AWS</option>
          <option value="Aporte de Capital">Aporte de Capital</option>
          <option value="Consultoria">Consultoria</option>
          <option value="Contratacao">Contratação</option>
        </select>

        <label>Status:</label>
        <select id="status">
          <option value="Todos">Todos</option>
          <option value="Paga">Paga</option>
          <option value="Pendente">Pendente</option>
          <option value="Recebida">Recebida</option>
        </select>

        <input type="submit" value="Filtrar">
      </form>
    </div>
    
    <div class="tabelas">
      <h3>Tabela / Lista de Lançamentos:</h3>
      <table>
        <thead>
          <tr>
            <th>Descrição</th>
            <th>Valor</th>
            <th>Departamento</th>
            <th>Movimentação</th>
            <th>Status</th>
          </tr>
        </thead>
        <!-- A tabela será preenchida dinamicamente aqui -->
        <tbody id="tabela-corpo"></tbody>
      </table>
    </div>
  </main>

  <footer>
    <p>Todos os direitos reservados</p>
  </footer>

  <script src="./6 - script.js"></script>
</body>
</html>
